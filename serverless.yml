service: lambda-kotlin-sls

plugins:
  - serverless-plugin-scripts

custom:
  defaultStage: dev
  scripts:
    hooks:
      # sls deploy / sls package 時に bootstrap を Kotlin/Native でビルドする。
      # GraalVM native-image を廃し、Kotlin/Native で Lambda(provided.al2023,
      # arm64) 向けの linuxArm64 実行ファイルを生成する。linuxArm64 は
      # linuxX64 ホストからクロスコンパイル可能なため QEMU は不要。OS 非依存に
      # 再現するため JDK 入りの Docker でビルドし、生成物を bootstrap に
      # リネームしてパッケージ直下へ配置する。
      'before:package:createDeploymentArtifacts': |
        docker run --rm -v "$PWD":/work -w /work eclipse-temurin:21-jdk \
          sh -c "./gradlew clean linkReleaseExecutableLinuxArm64 && cp ./build/bin/linuxArm64/releaseExecutable/bootstrap.kexe bootstrap && chmod +x bootstrap"

provider:
  name: aws
  runtime: provided.al2023
  architecture: arm64
  timeout: 20
  region: ap-northeast-1
  stage: ${opt:stage, self:custom.defaultStage}
  # environment:
  #   ${file(./env.yml)}

package:
  patterns:
    - '!./**'
    - bootstrap

functions:
  # provided ランタイムはパッケージ直下の bootstrap を実行する。
  # handler 文字列は _HANDLER として渡され、src/main/kotlin/main.kt の
  # Lambda.handler("...") と一致させることで処理を振り分ける。
  hello:
    handler: hello
    events:
      - http:
          path: test
          method: get
  world:
    handler: world
    events:
      - http:
          path: test
          method: post

